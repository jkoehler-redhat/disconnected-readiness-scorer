# yaml-language-server: $schema=../schemas/config.schema.json
#
# Central configuration for the disconnected readiness scanner.
# Applies to all scanned repos unless scoped by 'repo' field.

# Docker build context overrides for repos where COPY . . would otherwise
# resolve to repo root (making scope detection too broad).
# Format: dockerfile_path (relative to repo root) → context_dir (relative to repo root)
# Keyed by repo basename (or org/repo). Applied before Go/JS heuristics.
docker_contexts: {}

# Strings that look like image references (org/name:tag) but are YAML annotations,
# field role labels, or domain-specific identifiers — not container images.
known_non_image_prefixes:
  - "feast.io/"
  - "kubeflow.org/"
  - "k8s.io/"

params_env_filenames:
  notebooks:
    - params-latest.env

exceptions:

  # ---------------------------------------------------------------------------
  # Universal exceptions — apply to all repos
  # ---------------------------------------------------------------------------

  # Test directories
  - rules: "*"
    paths:
      - "**/test/**"
      - "**/tests/**"
      - "**/test_*/**"
      - "**/*_test/**"
      - "**/*_tests/**"
      - "**/*-test/**"
      - "**/*-tests/**"
      - "**/testdata/**"
      - "**/testing/**"
      - "**/*e2e*/**"
      - "**/mock/**"
      - "**/mocks/**"
      - "**/hack/**"
      - "**/fixture/**"
      - "**/testutil/**"
      - "**/loadtest/**"
    reason: "Test/dev directory — not deployed in production"

  # Test file patterns
  - rules: "*"
    paths:
      - "*_test.go"
      - "*_mock.go"
      - "mock_*.go"
      - "*_fake.go"
      - "fake_*.go"
      - "test_*.py"
      - "*.test.ts"
      - "*.test.tsx"
      - "*.spec.ts"
      - "*.spec.tsx"
      - "*.test.yml"
      - "*.test.yaml"
    reason: "Test/mock file"

  # CI directories
  - rules: "*"
    paths:
      - ".github/**"
      - ".tekton/**"
      - ".buildkite/**"
      - "**/ci/**"
    reason: "CI config — not deployed in production"

  # Non-production directories
  - rules: "*"
    paths:
      - "**/docs/**"
      - "**/examples/**"
      - "**/samples/**"
      - "**/demo/**"
      - "**/dev_tools/**"
    reason: "Non-production content — not deployed in production"

  # OLM scorecard config
  - rules: "*"
    paths:
      - "**/config/scorecard/**"
    reason: "OLM scorecard config — test images, not production"

  # Test kustomize overlays
  - rules: "*"
    paths:
      - "config/overlays/test/**"
      - "config/overlays/test-*/**"
      - "config/overlays/testing/**"
      - "config/overlays/kind-tests/**"
      - "config/overlays/odh-test/**"
    reason: "Test/sample configuration overlays — not deployed in production"

  # Build files
  - rules: "*"
    paths:
      - "**/Dockerfile"
      - "**/*.Dockerfile"
      - "**/Dockerfile.*"
      - "**/Containerfile"
      - "**/*.Containerfile"
      - "**/Containerfile.*"
    reason: "Build file — build-time only"

  # Lint config
  - rules: "*"
    paths:
      - "**/semgrep.yaml"
      - "**/semgrep.yml"
      - "**/.semgrep.yml"
    reason: "Linter config — not runtime"

  # ---------------------------------------------------------------------------
  # Repo-specific exceptions — scoped via 'repo' field
  #
  # Each repo from .github/config/repositories.yaml has a section below.
  # Add repo-specific path exclusions here rather than broadening the
  # universal rules above.
  # ---------------------------------------------------------------------------

  # --- odh-dashboard ---
  - rules:
      - no-image-tags
      - image-manifest-complete
      - no-runtime-egress
    repo: odh-dashboard
    paths:
      - "**/cypress/**"
      - "**/k8mocks/**"
      - "**/contract-tests/**"
      - "**/recordings/**"
      - "**/*.snap.json"
    reason: "Frontend test infrastructure — not deployed in production"

  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: odh-dashboard
    paths:
      - "distributions/*/developing/**"
    reason: "Local development tooling (Kind clusters, dev configs) — not deployed in production"

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: odh-dashboard
    paths:
      - "packages/*/api/openapi/**"
      - "packages/*/bff/openapi/**"
    reason: "OpenAPI specification files — image-like strings are example values documenting API response shapes, not runtime container references"

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: odh-dashboard
    paths:
      - "packages/*/upstream/**/openapi/**"
    reason: "Upstream OpenAPI/Swagger documentation — example values showing API response shapes, not runtime container references"

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: odh-dashboard
    paths:
      - "packages/*/bff/internal/api/middleware.go"
    images:
      - "quay.io/opendatahub/minio:*"
    reason: "Mock data inside getMockDSPipelineApplications() — only used when MockK8Client dev flag is enabled, never in production"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69988"

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: odh-dashboard
    paths:
      - "packages/model-registry/upstream/bff/internal/repositories/model_transfer_jobs.go"
    images:
      - "ghcr.io/kubeflow/hub/job/async-upload:*"
      - "quay.io/quay/busybox:*"
    reason: "Upstream Kubeflow model-registry code — async-upload image is mitigated by existing operator configuration, busybox image is unreachable in the disconnected scenario it protects against"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69988"

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: odh-dashboard
    paths:
      - "packages/notebooks/upstream/workspaces/frontend/manifests/kustomize/base/kustomization.yaml"
    reason: "Upstream base kustomize manifest — image is unused as bff manifests would replace this field"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69988"

  # Path moved from manifests/common/ to manifests/base/ in odh-dashboard#8708
  - rules: no-runtime-egress
    repo: odh-dashboard
    paths:
      - "**/deploy-python-model-quickstart.yaml"
      - "manifests/rhoai/apps/pachyderm/pachyderm-app.yaml"
    reason: "curl commands live inside OdhQuickStart/OdhApplication documentation fields shown in the dashboard UI — instructional text, not egress executed by the manifest"

  # --- kubeflow ---
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: kubeflow
    paths:
      - "components/odh-notebook-controller/config/development/ktunnel.yaml"
    images:
      - "quay.io/omrikiei/ktunnel:*"
    reason: "Dev-only ktunnel webhook tunnel for local development — not deployed in production"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69990"

  - rules: image-manifest-complete
    repo: kubeflow
    paths:
      - "components/notebook-controller/skaffold.yaml"
    images:
      - "gcr.io/kubeflow-ci/notebook-controller"
    reason: "Upstream Skaffold build config — build-time artifact target, not a runtime image"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69990"

  # --- notebooks ---
  - rules:
      - no-image-tags
      - image-manifest-complete
      - no-runtime-egress
      - python-imports-bundled
    repo: notebooks
    paths:
      - "scripts/**"
    reason: "Build-time utilities and CI scripts — not deployed in production"

  # --- kserve ---
  - rules: params-env-wiring
    repo: kserve
    message: "*ConfigMap/inferenceservice-config{key:_example}*"
    reason: "_example is a documentation-only field in inferenceservice-config — not functional configuration"

  # RHOAIENG-69993: Disconnected Readiness exceptions
  # Upstream default kustomize paths — ODH uses config/overlays/odh/
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: kserve
    paths:
      - "config/default/**"
      - "config/runtimes/**"
      - "config/localmodelnodes/**"
      - "config/localmodels/**"
      - "config/llmisvcconfig/**"
      - "config/llmisvc/**"
      - "config/overlays/version-template/**"
    reason: "Upstream KServe default kustomize — ODH/RHOAI uses config/overlays/odh/ which wires images through params.env and RELATED_IMAGE_* mechanism"

  # Sample/test Go code not in production binary
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: kserve
    paths:
      - "pkg/controller/v1alpha2/llmisvc/sample.go"
      - "pkg/controller/v1beta1/inferenceservice/tests_common.go"
    reason: "Sample/test Go code with hardcoded images — not compiled into production binary"

  # Orphan RELATED_IMAGE FAST vars — feature pending GA
  - rules: image-manifest-complete
    repo: kserve
    paths:
      - "kserve-module/pkg/kservemodule/images.go"
    message: "*RELATED_IMAGE*FAST*"
    reason: "Fast model update RELATED_IMAGE vars — operator wiring pending for this feature"
    expires: "2026-07-24"
    reference: "https://issues.redhat.com/browse/RHOAIENG-68059"

  # Test-only constant for OAuth proxy image
  - rules: image-manifest-complete
    repo: kserve
    paths:
      - "pkg/constants/constants_odh.go"
    message: "*odh-kube-auth-proxy*"
    reason: "Test-only constant — OauthProxyImage only used in *_test.go and tests_common.go files, not in production code. Comment at line 54 confirms 'Used for test purposes'"

  # LocalModelNode controller default storage-initializer image
  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: kserve
    paths:
      - "pkg/controller/v1alpha1/localmodelnode/controller.go"
    message: "*storage-initializer*"
    reason: "Default fallback image — overridden at runtime via inferenceservice-config ConfigMap, params.env wires kserve-storage-initializer to RELATED_IMAGE_ODH_KSERVE_STORAGE_INITIALIZER_IMAGE which injects the digest-pinned image"

  # Modelcar init container ubi-micro — no-image-tags is secondary to image-manifest-complete fix
  - rules: no-image-tags
    repo: kserve
    paths:
      - "pkg/webhook/admission/pod/storage_initializer_injector.go"
    message: "*ubi-micro*"
    reason: "Modelcar init container default — tag is replaced by digest-pinned image via RELATED_IMAGE_* injection at runtime. The image-manifest-complete blocker for this line is tracked separately for a code fix in kserve"

  # kserve-module operator controller image — injected by the platform operator, not params.env
  - rules: params-env-wiring
    repo: kserve
    paths:
      - "kserve-module/config"
    images:
      - "quay.io/opendatahub/odh-kserve-module-operator:*"
    reason: "Module operator controller image is overridden at runtime by opendatahub-operator via ModuleConfig.ControllerImage (RELATED_IMAGE_ODH_KSERVE_MODULE_OPERATOR_IMAGE) → injectModuleEnv, not through params.env. Same pattern as the mcp-lifecycle-module-operator and mlflow-operator exceptions below."

  # --- kuberay ---
  - rules:
      - no-image-tags
      - image-manifest-complete
      - no-runtime-egress
    repo: kuberay
    paths:
      - "apiserver/**"
      - "ray-operator/config/default-with-webhooks/**"
    reason: "API server and upstream default-with-webhooks kustomize overlay — not used by OpenShift kustomize, not deployed in production"

  - rules: image-manifest-complete
    repo: kuberay
    paths:
      - "ray-operator/controllers/ray/authentication_controller.go"
    images:
      - "registry.redhat.io/openshift4/ose-kube-rbac-proxy-rhel9*"
    reason: "Default fallback image — overridden at runtime via init() function that reads RELATED_IMAGE_ODH_KUBE_RBAC_PROXY_IMAGE env var, wired through params.env → kustomize ConfigMap → Deployment env in the OpenShift overlay"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69996"

  # --- trustyai-service-operator ---
  - rules: image-manifest-complete
    repo: trustyai-service-operator
    paths:
      - "trustyai-operator-module/pkg/trustyaimodule/images.go"
    message: "*RELATED_IMAGE_ODH_TRUSTYAI_OPERATOR_IMAGE*"
    reason: "Module controller uses RELATED_IMAGE_ODH_TRUSTYAI_OPERATOR_IMAGE to resolve the inner operator image; injected by opendatahub-operator ModuleConfig.ControllerImage at deploy time, not via OLM manifest."
    reference: "https://github.com/trustyai-explainability/trustyai-service-operator/pull/855"

  # --- model-registry-operator ---
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: model-registry-operator
    paths:
      - "internal/controller/config/defaults.go"
    images:
      - "quay.io/opendatahub/model-registry:*"
      - "quay.io/openshift/origin-oauth-proxy:*"
      - "quay.io/openshift/origin-kube-rbac-proxy:*"
      - "quay.io/sclorg/postgresql-16-c10s:*"
      - "quay.io/opendatahub/odh-model-metadata-collection:*"
    reason: "Default fallback images — overridden at runtime by env vars wired through params.env → kustomize ConfigMap → Deployment env replacement. Tags replaced by @sha256: digests via Build-Config repos at release time."
    reference: "https://issues.redhat.com/browse/RHOAIENG-69989"

  # --- training-operator ---
  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: training-operator
    paths:
      - "sdk/python/kubeflow/training/constants/constants.py"
      - "sdk/python/kubeflow/training/api/training_client.py"
    reason: "SDK client-side default images — users provide their own image; not used by the operator"

  - rules: python-imports-bundled
    repo: training-operator
    paths:
      - "sdk/python/kubeflow/training/utils/utils.py"
      - "sdk/python/kubeflow/training/api/training_client.py"
    reason: "utils.py generates a training pod script (user controls pip index URL); training_client.py is an error message string — neither is a runtime download"

  - rules: no-image-tags
    repo: training-operator
    paths:
      - "pkg/config/config.go"
    images:
      - "ghcr.io/kubeflow/training-v1/kubectl-delivery:*"
    reason: "MPI kubectl-delivery image default — MPI is not supported downstream"

  - rules: no-runtime-egress
    repo: training-operator
    paths:
      - "sdk/python/kubeflow/storage_initializer/**"
      - "sdk/python/kubeflow/trainer/hf_llm_training.py"
    reason: "Alpha SDK train() API — not supported downstream"

  # --- data-science-pipelines-operator ---
  # (no repo-specific exceptions)

  # --- odh-model-controller ---
  # (no repo-specific exceptions)

  # --- feast ---

  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: feast
    paths:
      - "go/infra/docker/**"
    reason: "Local development infrastructure (Docker Compose for OTel/Jaeger/Prometheus) — not deployed in production"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-07"

  - rules:
      - no-runtime-egress
      - python-imports-bundled
    repo: feast
    paths:
      - "sdk/python/feast/templates/**"
    reason: "Template/starter code copied to user projects via 'feast init' — not part of Feast runtime, never deployed in production"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"

  - rules: python-imports-bundled
    repo: feast
    paths:
      - "sdk/python/feast/image_utils.py"
      - "sdk/python/feast/torch_wrapper.py"
      - "sdk/python/feast/mlflow.py"
      - "sdk/python/feast/feature_store.py"
      - "sdk/python/feast/errors.py"
      - "sdk/python/feast/openlineage/client.py"
      - "sdk/python/feast/openlineage/mappers.py"
      - "sdk/python/feast/transformation/ray_transformation.py"
      - "sdk/python/feast/transformation/substrait_transformation.py"
      - "sdk/python/feast/dbt/parser.py"
      - "sdk/python/feast/api/registry/rest/rest_registry_server.py"
      - "sdk/python/feast/infra/mcp_servers/mcp_server.py"
      - "sdk/python/feast/infra/offline_stores/offline_store.py"
      - "sdk/python/feast/infra/online_stores/scylladb_online_store/scylladb.py"
    reason: "String literals in ImportError/warning messages or docstrings guiding users to install optional dependencies — no actual runtime pip subprocess invocations"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-21"

  - rules: no-runtime-egress
    repo: feast
    paths:
      - "sdk/python/feast/embedder.py"
    reason: "Optional MultiModalEmbedder feature — user opt-in only, models can be pre-cached via HF_HOME/SENTENCE_TRANSFORMERS_HOME env vars for disconnected environments"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-07"

  - rules: no-runtime-egress
    repo: feast
    paths:
      - "sdk/python/feast/infra/ray_initializer.py"
    reason: "User-invoked from_huggingface() API — does not run automatically, disconnected users use alternative data sources or pre-cached datasets"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-07"

  - rules: no-runtime-egress
    repo: feast
    paths:
      - "sdk/python/feast/transformation/ray_transformation.py"
    reason: "SentenceTransformer reference is inside a docstring usage example, not runtime code"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-07"

  - rules: no-image-tags
    repo: feast
    paths:
      - "sdk/python/feast/infra/compute_engines/kubernetes/k8s_engine.py"
    images:
      - "feast/feast-k8s-materialization:*"
    reason: "Configurable default image in Pydantic config — overridden by operator image injection and user config in production"
    reference: "https://issues.redhat.com/browse/RHOAIENG-69995"
    expires: "2027-07-07"

  - rules: image-manifest-complete
    repo: feast
    paths:
      - "infra/feast-operator/internal/controller/services/services_types.go"
    message: "*RELATED_IMAGE_CRON_JOB*"
    reason: "RELATED_IMAGE_CRON_JOB env var for feast-operator CronJob image — opendatahub-operator manifest wiring pending"

  # --- ogx-k8s-operator ---
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: ogx-k8s-operator
    paths:
      - "distributions.json"
    images:
      - "docker.io/ogxai/*"
    reason: "Upstream community distribution images - ODH/RHOAI sets RELATED_IMAGE_ODH_OGX_CORE_IMAGE which bypasses distributions.json entirely, using only the rh/rh-dev distribution image"

  - rules: image-manifest-complete
    repo: ogx-k8s-operator
    paths:
      - "pkg/cluster/cluster.go"
    message: "*RELATED_IMAGE*"
    reason: "Generic RELATED_IMAGE_* override support for upstream distributions - in ODH/RHOAI, RELATED_IMAGE_ODH_OGX_CORE_IMAGE takes precedence and these vars are never reached"

  - rules: params-env-wiring
    repo: ogx-k8s-operator
    message: "*RELATED_IMAGE_ODH_OGX_CORE_IMAGE*"
    reason: "Wired via kustomize replacements in config/overlays/odh/ and config/overlays/rhoai/ - params.env ConfigMap injects the value into the Deployment env var at render time, but the scanner checks rendered base manifests rather than overlay output"

  - rules: params-env-wiring
    repo: ogx-k8s-operator
    paths:
      - "ogx-module/config/default"
      - "ogx-module/config/manager"
    images:
      - "quay.io/opendatahub/odh-ogx-module-operator:*"
    reason: "Intermediate kustomize base layers. The actual deployment overlay ogx-module/config/overlays/odh/ wires RELATED_IMAGE_ODH_OGX_MODULE_OPERATOR_IMAGE from params.env via configMapGenerator + replacements into both the manager container and copy-manifests initContainer. The scanner checks base dirs in isolation rather than the leaf overlay."

  # --- ogx ---
  # (no repo-specific exceptions)

  # --- trainer ---
  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: trainer
    paths:
      - "manifests/base/runtimes/**"
    reason: "Upstream default runtimes — downstream provides its own runtime manifests"

  - rules: "no-image-tags"
    repo: trainer
    paths:
      - "api/python_api/**"
    reason: "Auto-generated Kubernetes API models with example image strings — not runtime references"

  - rules: no-runtime-egress
    repo: trainer
    paths:
      - "pkg/initializers/dataset/huggingface.py"
      - "pkg/initializers/model/huggingface.py"
    message: "*snapshot_download()*"
    reason: "User-triggered opt-in HuggingFace downloads via hf:// URI scheme. S3 alternative available for disconnected deployments."

  # --- models-as-a-service ---
  # Controller image param keys — overridden at runtime via RELATED_IMAGE_*
  # env vars injected by OLM. constants.go defines ImageParamKeys which maps
  # params.env keys to RELATED_IMAGE_* env vars; postrender.go ApplyParams
  # patches the corresponding Deployments/CronJobs at kustomize post-render.
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: models-as-a-service
    paths:
      - "maas-controller/pkg/platform/tenantreconcile/constants.go"
    reason: "ImageParamKeys maps param names to RELATED_IMAGE_* env vars — no actual image URIs to validate"

  - rules: image-manifest-complete
    repo: models-as-a-service
    paths:
      - "deployment/base/maas-api/core/kustomization.yaml"
      - "deployment/base/payload-processing/manager/kustomization.yaml"
      - "deployment/base/maas-api/core/cronjob-cleanup.yaml"
    reason: "Kustomize base manifests — images are injected by the controller at runtime via RELATED_IMAGE_* env vars"

  - rules: no-image-tags
    repo: models-as-a-service
    paths:
      - "deployment/base/maas-api/core/cronjob-cleanup.yaml"
    reason: "Base manifest tag — controller patches with digest from RELATED_IMAGE_UBI_MINIMAL_IMAGE at runtime"

  - rules: params-env-wiring
    repo: models-as-a-service
    paths:
      - "deployment/base/maas-api/**"
      - "deployment/base/maas-controller/default/**"
      - "deployment/base/maas-controller/manager/**"
      - "deployment/base/payload-processing/default/**"
      - "deployment/base/payload-processing/manager/**"
      - "deployment/overlays/openshift/**"
      - "deployment/overlays/xks/**"
    images:
      - "quay.io/opendatahub/maas-api:*"
      - "quay.io/opendatahub/maas-controller:*"
      - "quay.io/opendatahub/odh-ai-gateway-payload-processing:*"
      - "registry.redhat.io/ubi9/ubi-minimal:*"
    reason: "Base kustomize manifests — images are injected by the controller at runtime via RELATED_IMAGE_* env vars from params.env"

  - rules: params-env-wiring
    repo: models-as-a-service
    paths:
      - "deployment/components/odh/kserve/**"
    reason: "Local development convenience overlay — not referenced by production kustomize overlays; KServe is deployed separately by the opendatahub-operator KServe module"

  # --- mlflow-operator ---
  - rules: params-env-wiring
    repo: mlflow-operator
    paths:
      - "config/base"
      - "config/manager"
    images:
      - "localhost/mlflow-operator:*"
    reason: "Base/manager use a localhost CI/dev placeholder; production overlays (odh/rhoai/openshift) replace the controller image from params.env MLFLOW_OPERATOR_IMAGE"

  # --- spark-operator ---
  # (no repo-specific exceptions)

  # --- workload-variant-autoscaler ---
  - rules:
      - no-image-tags
      - no-runtime-egress
    repo: workload-variant-autoscaler
    paths:
      - "**/kind-emulator/**"
    reason: "Local Kind cluster emulator — not deployed in production"

  - rules: params-env-wiring
    repo: workload-variant-autoscaler
    paths:
      - "config/base"
      - "config/base/manager"
      - "config/overlays/cluster-scoped/kubernetes/**"
      - "config/overlays/cluster-scoped/openshift/**"
      - "config/overlays/namespace-scoped/kubernetes/**"
    reason: "Base manifests and non-namespace-scoped overlays — image placeholders are replaced by the namespace-scoped OpenShift overlay's params.env → configMapGenerator → replacements wiring"

  # --- opendatahub-operator ---
  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: opendatahub-operator
    paths:
      - "**/snapshots/**"
      - "**/internal/webhook/envtestutil/**"
    reason: "Test folders — not deployed in production"

  - rules: "*"
    repo: opendatahub-operator
    paths:
      - "config/**"
    images:
      - REPLACE_IMAGE:v0.0.0-placeholder
      - REPLACE_IMAGE:v0.0.0-rhoai-placeholder
    reason: "Test kustomize overlays — not deployed in production"

  - rules: no-image-tags
    repo: opendatahub-operator
    paths:
      - "config/manifests/bases/opendatahub-operator.clusterserviceversion.yaml"
    images:
      - "quay.io/opendatahub/opendatahub-operator:*"
    reason: "CSV base template placeholder — update-versions.sh overwrites this annotation on every release, and OLM bundle generation (--use-image-digests) produces the final digest-pinned value"
    reference: "https://issues.redhat.com/browse/RHOAIENG-70000"

  - rules: "*"
    repo: opendatahub-operator
    paths:
      - "cmd/manifest-tools/**"
    reason: "Manifest tools is a development CLI tool — not deployed in production"

  # --- mcp-lifecycle-module-operator ---
  - rules:
      - no-image-tags
      - image-manifest-complete
      - params-env-wiring
    repo: mcp-lifecycle-module-operator
    paths:
      - "config/manager/**"
      - "config/default"
    images:
      - "controller:*"
      - "quay.io/opendatahub/odh-mcp-lifecycle-module-operator"
      - "quay.io/opendatahub/odh-mcp-lifecycle-module-operator:*"
    reason: "Kubebuilder scaffold / checked-in default — production image set by opendatahub-operator ModuleConfig.ControllerImage (RELATED_IMAGE_ODH_MCP_LIFECYCLE_MODULE_OPERATOR_IMAGE) from ODH/RHOAI Build-Config digests"
    reference: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/internal/controller/modules/mcplifecycleoperator/handler.go"

  - rules: "*"
    repo: mcp-lifecycle-module-operator
    paths:
      - "config/manifests/mcp-lifecycle-operator/**"
    reason: "Unused — not deployed by the module-operator. Intermediate copy of the upstream MCPLO manifests, checked in only as kustomize input for `make update-operand-manifests`."

  - rules:
      - no-image-tags
      - image-manifest-complete
    repo: mcp-lifecycle-module-operator
    paths:
      - "internal/controller/resources/mcp-lifecycle-operator.yaml"
    images:
      - "quay.io/opendatahub/odh-mcp-lifecycle-operator:*"
    reason: "Checked-in default image for the operand Deployment — replaced at reconcile via OperandImage (RELATED_IMAGE_ODH_MCP_LIFECYCLE_OPERATOR_IMAGE, digest-pinned in ODH/RHOAI Build-Config)"
    reference: "https://github.com/opendatahub-io/mcp-lifecycle-module-operator/blob/main/internal/controller/mcplifecycleoperator_reconciler.go"

  - rules: params-env-wiring
    repo: mcp-lifecycle-module-operator
    message: "*RELATED_IMAGE_ODH_MCP_LIFECYCLE_OPERATOR_IMAGE*"
    reason: "Injected by opendatahub-operator into the module Deployment env — not wired via this repo's kustomize/params.env. Reconciler falls back to the embedded manifest default when unset."
    reference: "https://github.com/opendatahub-io/opendatahub-operator/blob/main/internal/controller/modules/mcplifecycleoperator/handler.go"

  # --- rhoai-mcp ---
  # rhoai-mcp is an MCP server (AI agent tool layer), not a Kubernetes operator.
  # It never deploys images — all image references are mock data, fallback
  # defaults for display, or documentation examples.

  # Mock cluster state — synthetic K8s resources for --mock-cluster mode (testing/demos)
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: rhoai-mcp
    paths:
      - "src/rhoai_mcp/mock_k8s/**"
      - "evals/mock_k8s/**"
    images:
      - "quay.io/modh/*"
    reason: "Mock cluster state — synthetic K8s resource fixtures for --mock-cluster mode, never pulled or deployed"

  # Notebook image catalog — static fallback list shown to users
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: rhoai-mcp
    paths:
      - "src/rhoai_mcp/domains/notebooks/client.py"
    images:
      - "image-registry.openshift-image-registry.svc:5000/*"
    reason: "Static notebook image catalog for display — fallback list returned when ImageStream querying is unavailable, not an operator deployment manifest"

  # Training runtime tool defaults — client-side fallback images for ClusterTrainingRuntime creation
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: rhoai-mcp
    paths:
      - "src/rhoai_mcp/domains/training/tools/runtimes.py"
    images:
      - "quay.io/modh/*"
    reason: "Client-side fallback images for runtime creation tool — the operator that reconciles the resulting CR is responsible for RELATED_IMAGE_* injection in disconnected clusters"

  # Inference tool docstring — example URIs in function documentation
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: rhoai-mcp
    paths:
      - "src/rhoai_mcp/domains/inference/tools.py"
    images:
      - "oci://quay.io/org/image[:@]*"
      - "registry.redhat.io/image[:@]*"
    reason: "Example URIs in docstring Args documentation (oci:// and docker:// examples) — not executable code"

  # Storage helper CLI suggestion — instructional oc run command printed as guidance text
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: rhoai-mcp
    paths:
      - "src/rhoai_mcp/composites/training/storage.py"
    images:
      - "registry.access.redhat.com/ubi9/ubi*"
    reason: "Image reference inside a suggested 'oc run' command printed as guidance text — never executed by the MCP server"

  # --- trainer-operator ---
  - rules:
      - image-manifest-complete
      - no-image-tags
    repo: trainer-operator
    paths:
      - "manifests/trainer/base/runtimes/**"
    reason: "Upstream Kubeflow Trainer default runtimes — RHOAI deploys exclusively from manifests/trainer/rhoai/ (operator SourcePath hardcoded to 'rhoai'). Community images (ghcr.io/kubeflow/trainer, pytorch/pytorch) are never used in production."

  - rules: image-manifest-complete
    repo: trainer-operator
    paths:
      - "manifests/trainer/overlays/kubeflow-platform/**"
      - "manifests/trainer/overlays/runtimes/**"
      - "manifests/trainer/third-party/**"
    reason: "Upstream Kubeflow community overlays and third-party controller manifests (JobSet, LeaderWorkerSet) — not used by RHOAI. Community overlays are only for the kubeflow-platform deployment path; third-party controllers are deployed separately via OLM. The RHOAI overlay (manifests/trainer/rhoai/) does not reference these paths."

  # --- data-connect-hub ---
  - rules: no-image-tags
    repo: data-connect-hub
    paths:
      - "dc-controller/cmd/**"
      - "dc-controller/internal/controller/**"
    images:
      - "ghcr.io/opendatahub-io/data-connect-hub/rest-service:latest"
      - "ghcr.io/opendatahub-io/data-connect-hub/flight-service:latest"
    reason: "Default fallback images — overridden at runtime via RELATED_IMAGE_ODH_DCH_REST_SERVICE and RELATED_IMAGE_ODH_DCH_FLIGHT_SERVICE env vars, wired through params.env with digest-pinned images from Build-Config"

  - rules: no-image-tags
    repo: data-connect-hub
    paths:
      - "dc-controller/config/manager/**"
    images:
      - "controller:latest"
      - "ghcr.io/opendatahub-io/data-connect-hub/rest-service:latest"
      - "ghcr.io/opendatahub-io/data-connect-hub/flight-service:latest"
    reason: "Kubebuilder scaffold defaults — controller image set by opendatahub-operator ModuleConfig.ControllerImage; RELATED_IMAGE env var values injected by opendatahub-operator from Build-Config digests at deployment time"

  - rules: no-image-tags
    repo: data-connect-hub
    paths:
      - "config/base/*/deployment.yaml"
    images:
      - "ghcr.io/opendatahub-io/data-connect-hub/rest-service:latest"
      - "ghcr.io/opendatahub-io/data-connect-hub/flight-service:latest"
    reason: "Base kustomize manifest placeholders — controller's reconcileService() injects kustomize Image overrides from RELATED_IMAGE_* env vars before rendering, replacing tags with digest-pinned images at runtime"


  - rules: no-image-tags
    repo: data-connect-hub
    paths:
      - "dc-controller/chart/**"
    images:
      - "ghcr.io/opendatahub-io/data-connect-hub/rest-service:latest"
      - "ghcr.io/opendatahub-io/data-connect-hub/flight-service:latest"
    reason: "Helm chart default values — overridden at runtime by opendatahub-operator with digest-pinned images from Build-Config"

  - rules: no-image-tags
    repo: data-connect-hub
    paths:
      - "dc-controller/.github/workflows/lint.yml"
      - "dc-controller/.github/workflows/test.yml"
    reason: "GitHub Actions workflow steps pinned to commit SHAs — CI infrastructure, not container images deployed in production"

  # --- llama-stack-provider-trustyai-garak ---
  - rules: image-manifest-complete
    repo: llama-stack-provider-trustyai-garak
    paths:
      - "src/llama_stack_provider_trustyai_garak/constants.py"
    images:
      - "quay.io/trustyai/trustyai-garak-lls-provider-dsp@sha256:*"
    reason: "Hardcoded digest-pinned DSP provider image — opendatahub-operator RELATED_IMAGE_* wiring pending for this component"
